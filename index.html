<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <form class="formulaire" action="" method="">
            <H1 class="input-box">Inscription à la formation musical</H1>
            <p class="intro">remplissez les champs ci-dessous pour vous inscrire.</p>
            <div class="champs">
                <label for="Nom">Nom et prenom</label>
                <input id="Nom" type="text" name="Nom" placeholder="Nom et prenom" autocomplete="Nom" minlength="5" required>


            </div>
            <div class="champs">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" placeholder="exemple43@gmail.com" autocomplete="email"
                    required>


            </div>
            <div class="champs">
                <label for="tel">Téléphone</label>
                <input id="tel" type="tel" name="tel" placeholder="+225 0500000000" autocomplete="tel" required>
            </div>

            <div class="champs">
                <label for="Niveau">Niveau harmonique</label>
                <select name="Niveau" id="Niveau">
                    <option value="">debutant</option>
                    <option value="">intermediaire</option>
                    <option value="">avancé</option>
                </select>
            </div>
            <div class="champs">
                <label for="file"></label>
                <input id="file" type="file" name="file" required>
            </div>

            <fieldset>
                <legend>instruments</legend>

                <label for="instruments" class="mode">
                    <input style="color: transparent;" type="radio" id="instruments" name="mode" value="piano">
                    piano
                </label>

                <label for="instruments" class="mode">
                    <input type="radio" id="instruments" name="mode" value="batterie">
                    baterrie
                </label>
                <label for="instruments" class="mode">
                    <input type="radio" id="instruments" name="mode" value="guitare">
                    guitare
                </label>

            </fieldset>

            <div class="champs">
                <label for="Message"></label>
                <textarea name="" id="" placeholder="votre message..." rows="2" cols="50"></textarea>
            </div>

            <button type="submit">envoyer</button>
        </form>
    </main>

</body>

</html>
